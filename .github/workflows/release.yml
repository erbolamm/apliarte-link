name: Release — Compilar binarios para todas las plataformas

on:
  push:
    tags:
      - 'v*'           # Se dispara al crear un tag como v0.1.0

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: apliarte-switch

jobs:
  build:
    name: Compilar ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: apliarte-switch-x86_64-apple-darwin

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: apliarte-switch-aarch64-apple-darwin

          # Linux x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: apliarte-switch-x86_64-unknown-linux-gnu

          # Windows x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: apliarte-switch-x86_64-pc-windows-msvc.exe

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache de dependencias Rust
        uses: Swatinem/rust-cache@v2

      - name: Compilar en release
        run: cargo build --release --target ${{ matrix.target }}

      # En Linux también generamos .deb para facilitar la instalación
      - name: Generar .deb (solo Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-deb
          cargo deb --target ${{ matrix.target }}

      - name: Preparar binario para subir
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe ${{ matrix.asset_name }}
          else
            cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }} ${{ matrix.asset_name }}
          fi

      - name: Subir binario como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  # ─────────────────────────────────────────────────────────────────────────────
  # App macOS completa: Flutter UI + daemon Rust embebido en el .app
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos-app:
    name: App macOS (Flutter + Rust universal)
    runs-on: macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust con targets macOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Compilar daemon Rust para arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Compilar daemon Rust para x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Crear binario universal (arm64 + x86_64)
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/${{ env.BIN_NAME }} \
            target/x86_64-apple-darwin/release/${{ env.BIN_NAME }} \
            -output ${{ env.BIN_NAME }}-universal
          file ${{ env.BIN_NAME }}-universal

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get
        working-directory: ui

      - name: Compilar app Flutter macOS
        run: flutter build macos --release
        working-directory: ui

      - name: Embeber daemon en el .app
        run: |
          APP_PATH="ui/build/macos/Build/Products/Release/apliarte_switch_ui.app"
          MACOS_DIR="$APP_PATH/Contents/MacOS"
          # Copiar el binario universal al mismo directorio que el ejecutable Flutter
          cp ${{ env.BIN_NAME }}-universal "$MACOS_DIR/${{ env.BIN_NAME }}"
          chmod +x "$MACOS_DIR/${{ env.BIN_NAME }}"
          echo "✅ Daemon embebido en $MACOS_DIR/${{ env.BIN_NAME }}"
          ls -lh "$MACOS_DIR/"

      - name: Firmar ad-hoc (permite ejecutar sin notarización)
        run: |
          APP_PATH="ui/build/macos/Build/Products/Release/apliarte_switch_ui.app"
          codesign --deep --force --sign "-" "$APP_PATH"
          echo "✅ App firmada ad-hoc"

      - name: Empaquetar .app en ZIP
        run: |
          cd "ui/build/macos/Build/Products/Release"
          zip -r "../../../../../apliarte-switch-macos-app.zip" "apliarte_switch_ui.app"
          echo "✅ ZIP generado"

      - name: Subir app como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apliarte-switch-macos-app
          path: apliarte-switch-macos-app.zip

  release:
    name: Crear Release en GitHub
    needs: [build, build-macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4

      - name: Renombrar binarios con nombres limpios
        run: |
          mv apliarte-switch-aarch64-apple-darwin/apliarte-switch-aarch64-apple-darwin       apliarte-switch-macos-arm64
          mv apliarte-switch-x86_64-apple-darwin/apliarte-switch-x86_64-apple-darwin         apliarte-switch-macos-x64
          mv apliarte-switch-x86_64-unknown-linux-gnu/apliarte-switch-x86_64-unknown-linux-gnu apliarte-switch-linux-x64
          mv "apliarte-switch-x86_64-pc-windows-msvc.exe/apliarte-switch-x86_64-pc-windows-msvc.exe" apliarte-switch-windows-x64.exe
          mv apliarte-switch-macos-app/apliarte-switch-macos-app.zip apliarte-switch-macos-app.zip

      - name: Crear o actualizar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          PRERELEASE=""
          if [[ "$TAG" == *alpha* ]] || [[ "$TAG" == *beta* ]]; then
            PRERELEASE="--prerelease"
          fi
          # Borrar release existente si hay (ignora error si no existe)
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" \
            apliarte-switch-macos-app.zip \
            apliarte-switch-macos-arm64 \
            apliarte-switch-macos-x64 \
            apliarte-switch-linux-x64 \
            apliarte-switch-windows-x64.exe \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE

  deploy-firebase:
    name: Deploy web a Firebase Hosting
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy a Firebase Hosting
        env:
          FIREBASE_TOKEN_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm install -g firebase-tools
          echo "$FIREBASE_TOKEN_JSON" > /tmp/firebase-key.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-key.json firebase deploy --only hosting --project apliarte-link
          rm /tmp/firebase-key.json
        working-directory: web

