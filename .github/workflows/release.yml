name: Release — Compilar y Publicar Binarios Multiplataforma

on:
  push:
    tags:
      - 'v*'           # Se dispara al crear un tag como v0.1.0

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: apliarte-link

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Crear el Release en estado Draft
  # ─────────────────────────────────────────────────────────────────────────────
  create-draft:
    name: Inicializar Release (Draft)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Crear Release Draft en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          PRERELEASE=""
          if [[ "$TAG" == *alpha* ]] || [[ "$TAG" == *beta* ]] || [[ "$TAG" == *rc* ]]; then
            PRERELEASE="--prerelease"
          fi

          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --draft \
              --generate-notes \
              $PRERELEASE
            echo "✅ Release draft creado para $TAG"
          else
            echo "ℹ️ Release $TAG ya existía como draft. Reutilizando..."
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Compilar daemons CLI Rust para todas las plataformas
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Compilar CLI (${{ matrix.asset_name }})
    needs: create-draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: apliarte-link-macos-x64

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: apliarte-link-macos-arm64

          # Linux x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: apliarte-link-linux-x64

          # Windows x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: apliarte-link-windows-x64.exe

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache de dependencias Rust
        uses: Swatinem/rust-cache@v2

      - name: Compilar binario release
        run: cargo build --release --target ${{ matrix.target }}

      # En Linux también generamos .deb para distribución Debian/Ubuntu
      - name: Generar .deb (solo Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-deb
          cargo deb --target ${{ matrix.target }}

      - name: Subir binario directamente a GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" "${{ matrix.asset_name }}"
          else
            cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}" "${{ matrix.asset_name }}"
          fi

          echo "Subiendo ${{ matrix.asset_name }} a Release ${{ github.ref_name }}..."
          gh release upload "${{ github.ref_name }}" "${{ matrix.asset_name }}" \
            --repo "${{ github.repository }}" \
            --clobber
          echo "✅ ${{ matrix.asset_name }} subido correctamente"

          # Si se generó paquete .deb en Linux, subirlo también
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            DEB_FILE=$(find target/${{ matrix.target }}/debian -name "*.deb" 2>/dev/null | head -n 1)
            if [ -n "$DEB_FILE" ] && [ -f "$DEB_FILE" ]; then
              echo "Subiendo paquete debian $DEB_FILE..."
              gh release upload "${{ github.ref_name }}" "$DEB_FILE" \
                --repo "${{ github.repository }}" \
                --clobber
              echo "✅ Paquete .deb subido correctamente"
            fi
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. App macOS completa: Flutter UI + daemon Rust embebido en el .app
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos-app:
    name: App macOS (Flutter + Rust universal)
    needs: create-draft
    runs-on: macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust con targets macOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Compilar daemon Rust para arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Compilar daemon Rust para x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Crear binario universal (arm64 + x86_64)
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/${{ env.BIN_NAME }} \
            target/x86_64-apple-darwin/release/${{ env.BIN_NAME }} \
            -output ${{ env.BIN_NAME }}-universal
          file ${{ env.BIN_NAME }}-universal

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get
        working-directory: apps/apliarte_link

      - name: Compilar app Flutter macOS
        run: flutter build macos --release
        working-directory: apps/apliarte_link

      - name: Embeber daemon en el .app
        run: |
          APP_PATH="apps/apliarte_link/build/macos/Build/Products/Release/apliarte_link.app"
          MACOS_DIR="$APP_PATH/Contents/MacOS"
          # Copiar el binario universal al mismo directorio que el ejecutable Flutter
          cp ${{ env.BIN_NAME }}-universal "$MACOS_DIR/${{ env.BIN_NAME }}"
          chmod +x "$MACOS_DIR/${{ env.BIN_NAME }}"
          echo "✅ Daemon embebido en $MACOS_DIR/${{ env.BIN_NAME }}"
          ls -lh "$MACOS_DIR/"

      - name: Firmar ad-hoc (permite ejecutar sin notarización)
        run: |
          APP_PATH="apps/apliarte_link/build/macos/Build/Products/Release/apliarte_link.app"
          codesign --deep --force --sign "-" "$APP_PATH"
          echo "✅ App firmada ad-hoc"

      - name: Empaquetar .app en ZIP
        run: |
          cd "apps/apliarte_link/build/macos/Build/Products/Release"
          zip -r "$GITHUB_WORKSPACE/apliarte-link-macos-app.zip" "apliarte_link.app"
          echo "✅ ZIP generado"

      - name: Subir app macOS directamente a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Subiendo apliarte-link-macos-app.zip a Release ${{ github.ref_name }}..."
          gh release upload "${{ github.ref_name }}" "$GITHUB_WORKSPACE/apliarte-link-macos-app.zip" \
            --repo "${{ github.repository }}" \
            --clobber
          echo "✅ apliarte-link-macos-app.zip subido correctamente"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. App Windows completa: Flutter UI + daemon Rust embebido
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows-app:
    name: App Windows (Flutter + Rust)
    needs: create-draft
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Compilar daemon Rust para Windows
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get
        working-directory: apps/apliarte_link

      - name: Compilar app Flutter Windows
        run: flutter build windows --release
        working-directory: apps/apliarte_link

      - name: Embeber daemon en la carpeta de la app
        shell: bash
        run: |
          RELEASE_DIR="apps/apliarte_link/build/windows/x64/runner/Release"
          cp "target/x86_64-pc-windows-msvc/release/${{ env.BIN_NAME }}.exe" "$RELEASE_DIR/${{ env.BIN_NAME }}.exe"
          echo "✅ Daemon embebido en $RELEASE_DIR"
          ls -lh "$RELEASE_DIR/"

      - name: Empaquetar en ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "apps/apliarte_link/build/windows/x64/runner/Release/*" -DestinationPath "apliarte-link-windows-app.zip"
          Write-Host "✅ ZIP generado"

      - name: Subir app Windows directamente a GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Subiendo apliarte-link-windows-app.zip a Release ${{ github.ref_name }}..."
          gh release upload "${{ github.ref_name }}" apliarte-link-windows-app.zip \
            --repo "${{ github.repository }}" \
            --clobber
          echo "✅ apliarte-link-windows-app.zip subido correctamente"

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. App Linux completa: Flutter UI + daemon Rust embebido (.tar.gz)
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux-app:
    name: App Linux (Flutter + Rust)
    needs: create-draft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema para Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Compilar daemon Rust para Linux
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get
        working-directory: apps/apliarte_link

      - name: Compilar app Flutter Linux
        run: flutter build linux --release
        working-directory: apps/apliarte_link

      - name: Embeber daemon en la carpeta del bundle Linux
        shell: bash
        run: |
          BUNDLE_DIR="apps/apliarte_link/build/linux/x64/release/bundle"
          cp "target/x86_64-unknown-linux-gnu/release/${{ env.BIN_NAME }}" "$BUNDLE_DIR/${{ env.BIN_NAME }}"
          chmod +x "$BUNDLE_DIR/${{ env.BIN_NAME }}"
          echo "✅ Daemon embebido en $BUNDLE_DIR"
          ls -lh "$BUNDLE_DIR/"

      - name: Empaquetar bundle en tar.gz
        shell: bash
        run: |
          tar -czvf apliarte-link-linux-app.tar.gz -C apps/apliarte_link/build/linux/x64/release bundle
          echo "✅ Tar.gz generado"

      - name: Subir app Linux directamente a GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Subiendo apliarte-link-linux-app.tar.gz a Release ${{ github.ref_name }}..."
          gh release upload "${{ github.ref_name }}" apliarte-link-linux-app.tar.gz \
            --repo "${{ github.repository }}" \
            --clobber
          echo "✅ apliarte-link-linux-app.tar.gz subido correctamente"

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Publicar Release Oficial (Desmarcar Draft)
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publicar Release Oficial
    needs: [create-draft, build, build-macos-app, build-windows-app, build-linux-app]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Quitar estado Draft del Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Publicando release oficial $TAG..."
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
          echo "✅ Release $TAG publicado con éxito y disponible públicamente."
