name: Release — Compilar binarios para todas las plataformas

on:
  push:
    tags:
      - 'v*'           # Se dispara al crear un tag como v0.1.0

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: apliarte-link

jobs:
  build:
    name: Compilar ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: apliarte-link-x86_64-apple-darwin

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: apliarte-link-aarch64-apple-darwin

          # Linux x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: apliarte-link-x86_64-unknown-linux-gnu

          # Windows x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: apliarte-link-x86_64-pc-windows-msvc.exe

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache de dependencias Rust
        uses: Swatinem/rust-cache@v2

      - name: Compilar en release
        run: cargo build --release --target ${{ matrix.target }}
        continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}

      # En Linux también generamos .deb para facilitar la instalación
      - name: Generar .deb (solo Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-deb
          cargo deb --target ${{ matrix.target }}

      - name: Preparar binario para subir
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe ${{ matrix.asset_name }}
          else
            cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }} ${{ matrix.asset_name }}
          fi

      - name: Subir binario como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Calidad: analyze + tests (Flutter app + core) antes de empaquetar
  # Reutiliza .github/workflows/ci.yml vía workflow_call
  # ─────────────────────────────────────────────────────────────────────────────
  quality:
    name: Calidad (analyze + tests)
    uses: ./.github/workflows/ci.yml

  # ─────────────────────────────────────────────────────────────────────────────
  # App macOS completa: Flutter UI + daemon Rust embebido en el .app
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos-app:
    name: App macOS (Flutter + Rust universal)
    runs-on: macos-latest
    needs: quality

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust con targets macOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Compilar daemon Rust para arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Compilar daemon Rust para x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Crear binario universal (arm64 + x86_64)
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/${{ env.BIN_NAME }} \
            target/x86_64-apple-darwin/release/${{ env.BIN_NAME }} \
            -output ${{ env.BIN_NAME }}-universal
          file ${{ env.BIN_NAME }}-universal

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get
        working-directory: apps/apliarte_link

      - name: Compilar app Flutter macOS
        run: flutter build macos --release
        working-directory: apps/apliarte_link

      - name: Embeber daemon en el .app
        run: |
          APP_PATH="apps/apliarte_link/build/macos/Build/Products/Release/apliarte_link.app"
          MACOS_DIR="$APP_PATH/Contents/MacOS"
          # Copiar el binario universal al mismo directorio que el ejecutable Flutter
          cp ${{ env.BIN_NAME }}-universal "$MACOS_DIR/${{ env.BIN_NAME }}"
          chmod +x "$MACOS_DIR/${{ env.BIN_NAME }}"
          echo "✅ Daemon embebido en $MACOS_DIR/${{ env.BIN_NAME }}"
          ls -lh "$MACOS_DIR/"

      - name: Firmar ad-hoc (permite ejecutar sin notarización)
        run: |
          APP_PATH="apps/apliarte_link/build/macos/Build/Products/Release/apliarte_link.app"
          codesign --deep --force --sign "-" "$APP_PATH"
          echo "✅ App firmada ad-hoc"

      - name: Empaquetar .app en ZIP
        run: |
          cd "apps/apliarte_link/build/macos/Build/Products/Release"
          zip -r "$GITHUB_WORKSPACE/apliarte-link-macos-app.zip" "apliarte_link.app"
          echo "✅ ZIP generado"

      - name: Subir app como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apliarte-link-macos-app
          path: apliarte-link-macos-app.zip

  # ─────────────────────────────────────────────────────────────────────────────
  # App Windows completa: Flutter UI + daemon Rust embebido
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows-app:
    name: App Windows (Flutter + Rust)
    runs-on: windows-latest
    needs: quality

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Compilar daemon Rust para Windows
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get
        working-directory: apps/apliarte_link

      - name: Compilar app Flutter Windows
        run: flutter build windows --release
        working-directory: apps/apliarte_link

      - name: Embeber daemon en la carpeta de la app
        shell: bash
        run: |
          RELEASE_DIR="apps/apliarte_link/build/windows/x64/runner/Release"
          cp "target/x86_64-pc-windows-msvc/release/${{ env.BIN_NAME }}.exe" "$RELEASE_DIR/${{ env.BIN_NAME }}.exe"
          echo "✅ Daemon embebido en $RELEASE_DIR"
          ls -lh "$RELEASE_DIR/"

      - name: Empaquetar en ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "apps/apliarte_link/build/windows/x64/runner/Release/*" -DestinationPath "apliarte-link-windows-app.zip"
          Write-Host "✅ ZIP generado"

      - name: Subir app Windows como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apliarte-link-windows-app
          path: apliarte-link-windows-app.zip

  build-linux-app:
    name: App Linux (Flutter + Rust)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias Linux (GTK para Flutter)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Compilar daemon Rust para Linux
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get
        working-directory: apps/apliarte_link

      - name: Compilar app Flutter Linux
        run: flutter build linux --release
        working-directory: apps/apliarte_link

      - name: Embeber daemon en el bundle
        run: |
          BUNDLE_DIR="apps/apliarte_link/build/linux/x64/release/bundle"
          cp "target/x86_64-unknown-linux-gnu/release/${{ env.BIN_NAME }}" "$BUNDLE_DIR/${{ env.BIN_NAME }}"
          chmod +x "$BUNDLE_DIR/${{ env.BIN_NAME }}"
          echo "✅ Daemon embebido en $BUNDLE_DIR/${{ env.BIN_NAME }}"
          ls -lh "$BUNDLE_DIR/"

      - name: Empaquetar en ZIP
        run: |
          cd "apps/apliarte_link/build/linux/x64/release"
          zip -r "$GITHUB_WORKSPACE/apliarte-link-linux-app.zip" "bundle"
          echo "✅ ZIP generado"

      - name: Subir app Linux como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apliarte-link-linux-app
          path: apliarte-link-linux-app.zip

  release:
    name: Crear Release en GitHub
    needs: [build-macos-app, build-windows-app, build-linux-app]
    if: needs.build-macos-app.result == 'success' && needs.build-windows-app.result == 'success' && needs.build-linux-app.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4

      - name: Renombrar binarios con nombres limpios
        run: |
          mv apliarte-link-aarch64-apple-darwin/apliarte-link-aarch64-apple-darwin       apliarte-link-macos-arm64
          mv apliarte-link-x86_64-apple-darwin/apliarte-link-x86_64-apple-darwin         apliarte-link-macos-x64
          if [ -f "apliarte-link-x86_64-unknown-linux-gnu/apliarte-link-x86_64-unknown-linux-gnu" ]; then
            mv apliarte-link-x86_64-unknown-linux-gnu/apliarte-link-x86_64-unknown-linux-gnu apliarte-link-linux-x64
            echo "LINUX_BIN=apliarte-link-linux-x64" >> $GITHUB_ENV
          else
            echo "LINUX_BIN=" >> $GITHUB_ENV
            echo "⚠️ Binario Linux no disponible (falló el build)"
          fi
          mv "apliarte-link-x86_64-pc-windows-msvc.exe/apliarte-link-x86_64-pc-windows-msvc.exe" apliarte-link-windows-x64.exe
          # Apps completas — opcionales, solo si sus jobs terminaron bien
          if [ -f "apliarte-link-macos-app/apliarte-link-macos-app.zip" ]; then
            mv apliarte-link-macos-app/apliarte-link-macos-app.zip apliarte-link-macos-app.zip
            echo "MACOS_APP=apliarte-link-macos-app.zip" >> $GITHUB_ENV
          else
            echo "MACOS_APP=" >> $GITHUB_ENV
            echo "⚠️ App macOS no disponible en este release"
          fi
          if [ -f "apliarte-link-windows-app/apliarte-link-windows-app.zip" ]; then
            mv apliarte-link-windows-app/apliarte-link-windows-app.zip apliarte-link-windows-app.zip
            echo "WINDOWS_APP=apliarte-link-windows-app.zip" >> $GITHUB_ENV
          else
            echo "WINDOWS_APP=" >> $GITHUB_ENV
            echo "⚠️ App Windows no disponible en este release"
          fi
          if [ -f "apliarte-link-linux-app/apliarte-link-linux-app.zip" ]; then
            mv apliarte-link-linux-app/apliarte-link-linux-app.zip apliarte-link-linux-app.zip
            echo "LINUX_APP=apliarte-link-linux-app.zip" >> $GITHUB_ENV
          else
            echo "LINUX_APP=" >> $GITHUB_ENV
            echo "⚠️ App Linux no disponible en este release"
          fi

      - name: Crear o actualizar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          PRERELEASE=""
          if [[ "$TAG" == *alpha* ]] || [[ "$TAG" == *beta* ]]; then
            PRERELEASE="--prerelease"
          fi
          # Binarios crudos siempre presentes (Linux opcional)
          FILES="apliarte-link-macos-arm64 apliarte-link-macos-x64 apliarte-link-windows-x64.exe"
          if [ -n "$LINUX_BIN" ]; then FILES="$LINUX_BIN $FILES"; fi
          # Apps completas si están disponibles
          if [ -n "$MACOS_APP" ]; then FILES="$MACOS_APP $FILES"; fi
          if [ -n "$WINDOWS_APP" ]; then FILES="$WINDOWS_APP $FILES"; fi
          if [ -n "$LINUX_APP" ]; then FILES="$LINUX_APP $FILES"; fi
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" \
            $FILES \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE

  deploy-firebase:
    name: Deploy web a Firebase Hosting
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy a Firebase Hosting
        env:
          FIREBASE_TOKEN_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm install -g firebase-tools
          echo "$FIREBASE_TOKEN_JSON" > /tmp/firebase-key.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-key.json firebase deploy --only hosting --project apliarte-link
          rm /tmp/firebase-key.json
        working-directory: web

