name: Deploy web a Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'

jobs:
  deploy:
    name: Deploy Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Descargar binarios del release y empaquetar en ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public/downloads
          gh release download --repo erbolamm/apliarte-link \
            --pattern 'apliarte-link-*' \
            --dir public/downloads \
            --clobber
          cd public/downloads
          if [ -f apliarte-link-linux-x64 ] && [ ! -f apliarte-link-linux-x64.zip ]; then
            mkdir -p linux-tmp
            cp apliarte-link-linux-x64 linux-tmp/apliarte-link
            (cd linux-tmp && zip -q ../apliarte-link-linux-x64.zip apliarte-link)
            rm -rf linux-tmp
          fi
          rm -f apliarte-link-linux-x64 apliarte-link-macos-arm64 apliarte-link-macos-x64 apliarte-link-windows-x64.exe
          echo "=== Binarios listos (solo ZIP) ==="
          ls -la
        working-directory: web

      - name: Deploy a Firebase Hosting
        env:
          FIREBASE_TOKEN_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm install -g firebase-tools
          echo "$FIREBASE_TOKEN_JSON" > /tmp/firebase-key.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-key.json firebase deploy --only hosting --project apliarte-link
          rm /tmp/firebase-key.json
        working-directory: web
